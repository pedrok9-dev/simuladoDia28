<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadEntrega.js"defer></script>
    <title>Cadastrar</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Entrega</h1>
        <br>
        <form>
            <label for="cidade">cidade</label><br>
            <input type="text" id="cidade"><br><br>

            <label for="status">status ex: Entregue ou Transito</label><br>
            <input type="text" id="status"><br><br>

            <label for="data">data</label><br>
            <input type="date" id="data"><br><br>

            <label for="hora">hora</label><br>
            <input type="time" id="hora"><br><br>

            <label for="idCarga">idCarga</label><br>
            <input type="text" id="idCarga"><br><br>

            <button id="btn">Cadastrar</button>
        </form>
        <div id="resposta"></div>
    </main>
</body>
</html>
